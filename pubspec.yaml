name: lankalink
description: "A digital Sri Lanka application for the National Data Network."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  provider: ^6.1.5+1
  uuid: ^4.6.0
  google_maps_flutter: ^2.18.0
  shared_preferences: ^2.2.2
  csv: ^5.0.2
  pdf: ^3.10.4
  path_provider: ^2.1.1
  printing: ^5.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/AbhayaLibre-Regular.ttf
    - assets/fonts/UN-Samantha.ttf
    - assets/fonts/UN-Ganganee.ttf
    - assets/fonts/UN-Basuru.ttf   

  fonts:
    - family: UNSamantha
      fonts:
        - asset: assets/fonts/UN-Samantha.ttf
    - family: UNGanganee
      fonts:
        - asset: assets/fonts/UN-Ganganee.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF" 
  adaptive_icon_foreground: "assets/images/app_icon.png"
  web:
    generate: true
  windows:
    generate: true