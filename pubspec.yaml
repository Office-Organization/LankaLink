name: lankalink
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cupertino_icons: ^1.0.8
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application.
  uses-material-design: true

  # අකුරු සහ අනෙකුත් ජායාරූප assets ඇතුළත් කිරීම
  assets:
    - assets/fonts/

  # ඔබේ Unicode fonts මෙහි ලියාපදිංචි කිරීම (මෙය අනිවාර්ය වේ)
  fonts:
    - family: UN-Imanee
      fonts:
        - asset: assets/fonts/UN-Imanee.ttf
          weight: 400

    - family: UN-Sandhyanee
      fonts:
        - asset: assets/fonts/UN-Sandhyanee.ttf
          weight: 400